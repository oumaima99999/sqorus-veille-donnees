name: Relais documents (Chances de gain)
# Télécharge les documents publics demandés par le relais « Chances de gain » (fichiers demandes/*.json)
# et publie leur texte intégral, page par page, dans textes/<id>.json. Aucun autre usage.
on:
  push:
    branches: [relais-documents]
    paths: ["demandes/**"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: relais-documents
  cancel-in-progress: false
jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relais-documents
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: python3 scripts/telecharger.py
      - name: Publier les textes
        run: |
          git config user.name "relais-documents"
          git config user.email "relais-documents@users.noreply.github.com"
          git add textes/
          git diff --cached --quiet || git commit -m "Textes extraits : $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin relais-documents && git push -q origin HEAD:relais-documents && break; sleep 5; done
