name: Relais de veille (APProch + DECP)
on:
  schedule:
    - cron: "17 4,16 * * *"   # deux fois par jour (UTC)
  workflow_dispatch: {}        # lancement manuel possible depuis l'onglet Actions
  push:
    paths: ["relais/**", ".github/workflows/relais.yml"]
permissions:
  contents: write
concurrency:
  group: relais
  cancel-in-progress: false
jobs:
  relais:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb==1.1.3 pandas==2.2.3
      - run: python relais/relais.py
      - name: Publier les fichiers mis à jour
        run: |
          git config user.name "relais-veille"
          git config user.email "relais-veille@users.noreply.github.com"
          git add donnees/
          git diff --cached --quiet || git commit -m "Relais : données du $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
